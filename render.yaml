# Free hackathon deployment. Local state resets on restart; no paid disk.
services:
  - type: web
    name: cortex-backend
    runtime: python
    repo: https://github.com/GaneshNair007/CORTEX-CLOUD-AUTOPILOT-
    branch: main
    plan: free
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: >-
      pip install -r backend/requirements-free.txt &&
      python -m backend.scripts.prepare_embeddings
    startCommand: sh backend/startup.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: LLM_PRIMARY_PROVIDER
        value: nvidia
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_API_KEY
        sync: false
      - key: LLM_FALLBACK_PROVIDERS
        value: heuristic
      - key: ALLOW_PAID_LLM_FALLBACK
        value: 'false'
      - key: CORTEX_ADMIN_TOKEN
        sync: false
      - key: CORTEX_OPERATOR_TOKEN
        sync: false
      - key: CORTEX_VIEWER_TOKEN
        sync: false
      - key: CORTEX_PUBLIC_READS
        value: 'true'
      - key: CORTEX_CORS_ORIGINS
        value: https://cortex-cloud-autopilot.vercel.app
      - key: APP_URL
        sync: false
      - key: CORTEX_DATA_DIR
        value: /tmp/cortex
      - key: CORTEX_CHROMA_DIR
        value: /tmp/cortex/chroma
      - key: CORTEX_PERSISTENT_STORAGE
        value: 'false'
      - key: CORTEX_START_SANDBOX
        value: 'true'
      - key: HF_HOME
        value: /opt/render/project/src/.cache/huggingface
      - key: HF_HUB_OFFLINE
        value: '1'
      - key: CORTEX_EMBEDDING_RUNTIME
        value: onnx
      - key: OMP_NUM_THREADS
        value: '1'
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: TOKENIZERS_PARALLELISM
        value: 'false'
